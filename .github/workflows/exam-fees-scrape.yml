name: Exam Fees Scrape

on:
  schedule:
    # Days 1–7 each month at 00:30 UTC (~6:00 AM IST); scrape job runs only on the first Sunday
    - cron: "30 0 1-7 * *"
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: exam-fees-scrape
  cancel-in-progress: false

jobs:
  gate:
    runs-on: ubuntu-latest
    outputs:
      proceed: ${{ steps.check.outputs.proceed }}
    steps:
      - name: First Sunday of month check
        id: check
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "proceed=true" >> "$GITHUB_OUTPUT"
          elif [ "$(date -u +%w)" = "0" ]; then
            echo "proceed=true" >> "$GITHUB_OUTPUT"
          else
            echo "proceed=false" >> "$GITHUB_OUTPUT"
          fi

  scrape:
    needs: gate
    if: needs.gate.outputs.proceed == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install requests beautifulsoup4

      - name: Scrape exam fees
        run: python scripts/scrape_exam_fees.py

      - name: Commit results
        run: |
          git config user.name "portal-uptime-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/exam-fees.json
          git diff --cached --quiet && echo "No changes to commit" || git commit -m "Exam fees scrape $(date -u +'%Y-%m-%d %H:%M UTC')"
          git push
